id = "mija.timer"
name = "Mija"
version = "0.3.1"
min_herdr_version = "0.8.2"
description = "A Pomodoro timer for Herdr"
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release"]

[[panes]]
id = "timer"
title = "Mija"
placement = "tab"
command = ["./target/release/mija"]

# Bind a key to this in ~/.config/herdr/config.toml:
#   [[keys.command]]
#   key = "prefix+m"
#   type = "plugin_action"
#   command = "mija.timer.open"
[[actions]]
id = "open"
title = "Open Mija timer"
contexts = ["workspace"]
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin mija.timer --entrypoint timer"]
